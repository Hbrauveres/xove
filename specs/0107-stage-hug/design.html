<title>Stage Fit Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Draft for #107, round one: a stage that takes the picture's shape (no black bars), and a richer, lighter info row. Xovê's own tokens. */
:root {
  color-scheme: dark;
  --ground: #0b0e13; --surface: #151b24; --line: #222b38;
  --text: #e7ebf1; --text-muted: #8b96a8; --text-faint: #5d6778;
  --tally: #f2a93b; --tally-ink: #1a1206; --live: #ef4b4b; --ok: #3fbf7f;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --edge: 24px; --info-h: 104px; --gap: 14px;
}
@media (max-width: 760px) { :root { --edge: 12px; --info-h: 190px; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-body); font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; }

/* ---- draft controls (not part of the app) ---- */
.switcher { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 7px 16px; background: #05070a; border-bottom: 1px dashed var(--line); font-size: .8125rem; color: var(--text-muted); position: relative; z-index: 60; }
.switcher strong { color: var(--text); font-family: var(--font-display); }
.group { display: inline-flex; align-items: center; gap: 4px; }
.group > span { margin-right: 4px; }
.sbtn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: .75rem; color: var(--text-muted); cursor: pointer; }
.sbtn:hover { border-color: var(--tally); color: var(--tally); }
.sbtn[aria-pressed="true"] { background: var(--tally); border-color: var(--tally); color: var(--tally-ink); }

/* ---- header (unchanged, simplified for the draft) ---- */
.header { flex: none; height: 60px; padding: 0 var(--edge); display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; letter-spacing: -.03em; }
.logo span { color: var(--tally); }
.ghost { height: 38px; width: min(440px, 40vw); border-radius: 999px; border: 1px solid rgba(255,255,255,.08); background: rgba(16,20,27,.72); }
.footer { flex: none; height: 40px; padding: 0 var(--edge); display: flex; align-items: center; color: var(--text-faint); font-size: .75rem; position: relative; z-index: 2; }

/* ---- the middle: the stage takes the picture's own shape ---- */
.middle { flex: 1; min-height: 0; position: relative; padding: 0 var(--edge); display: grid; place-items: center; }
.column { display: flex; flex-direction: column; gap: var(--gap); position: relative; }
.stagebox { position: relative; display: grid; place-items: center; }
.stage { position: relative; border-radius: 14px; overflow: hidden; background: #000; transition: width .35s ease, height .35s ease; }
.pic { position: absolute; inset: 0; }
.blurfill { position: absolute; inset: -40px; filter: blur(40px) brightness(.55); transform: scale(1.1); }
.stage .inner { position: absolute; }
.light { position: absolute; z-index: -1; border-radius: 30px; filter: blur(70px); opacity: .55; transition: all .35s ease; }
.empty { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); }
.empty i:nth-child(1) { background: #222a33; } .empty i:nth-child(2) { background: #252822; } .empty i:nth-child(3) { background: #18272a; } .empty i:nth-child(4) { background: #1b2730; } .empty i:nth-child(5) { background: #201f2c; } .empty i:nth-child(6) { background: #2a1d22; } .empty i:nth-child(7) { background: #18202e; }
.rbtns { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; z-index: 2; }
.rbtn { width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(8,10,14,.82); display: grid; place-items: center; color: var(--text); }
.rbtn.on { background: var(--tally); color: var(--tally-ink); }

/* ---- the info row ---- */
.info { container-type: inline-size; height: var(--info-h); display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 14px; }
@media (max-width: 760px) { .info { flex-direction: column; gap: 14px; } }

/* Left: who is on the stage. The ring is drawn inside the avatar's box, so its outer edge is the column's edge. */
.now { flex: 1 1 auto; display: flex; align-items: center; gap: 14px; min-width: 0; }
.now > div { min-width: 0; }
.meta > * { flex: none; }
/* Short of room, the left gives way first: who's watching drops its words, then its avatars. */
@container (max-width: 900px) { .watchers .wtext { display: none; } }
@container (max-width: 760px) { .watchers, .sep { display: none; } }
.av { position: relative; flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1rem; }
.av.ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 2.5px var(--tally), inset 0 0 0 4.5px var(--ground); }
.av.sm { width: 22px; height: 22px; font-size: .625rem; }
.av.cam { overflow: hidden; }
.av.cam .face { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, #e7b98f 0 26%, transparent 27%), radial-gradient(circle at 50% 105%, #3b5b7a 0 45%, transparent 46%), #6b7a8c; }
.name { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; line-height: 1.1; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { display: flex; align-items: center; gap: 10px; margin: 6px 0 0; color: var(--text-muted); font-size: .8125rem; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px 2px 6px; border-radius: 5px; background: var(--live); color: #fff; font-family: var(--font-mono); font-size: .625rem; letter-spacing: .1em; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.elapsed { font-family: var(--font-mono); font-size: .75rem; color: var(--text-faint); }
.sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-faint); }
.watchers { display: inline-flex; align-items: center; gap: 8px; }
.stack { display: inline-flex; gap: 4px; }

/* Empty: an invitation, not a status line. */
.invite .title { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; margin: 0; line-height: 1.1; }
.invite .title em { font-style: normal; color: var(--tally); }
.invite p { margin: 6px 0 0; color: var(--text-muted); font-size: .8125rem; display: flex; align-items: center; gap: 8px; }

/* Right: other streams, lighter. Six small slots say how full the 6 are. */
/* The right never runs past the column: past its room, the previews scroll. */
.also { flex: 0 1 auto; display: grid; justify-items: end; gap: 8px; min-width: 0; max-width: calc(100% - 280px); }
.strip { max-width: 100%; min-width: 0; }
/* A slim bar under the previews: no arrows, rounded, faint until the pointer is over the strip. It sits in the gap below, so nothing moves. */
.scroll { display: flex; gap: 10px; min-width: 0; overflow-x: auto; padding-bottom: 8px; margin-bottom: -8px; }
.scroll::-webkit-scrollbar { height: 4px; }
.scroll::-webkit-scrollbar-button { display: none; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(255,255,255,.1); transition: background .2s; }
.scroll:hover::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); }
.scroll::-webkit-scrollbar-thumb:hover { background: var(--tally); }
@supports not selector(::-webkit-scrollbar) { .scroll { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.28) transparent; } }
.free { flex: none; }
@media (max-width: 760px) { .also { justify-items: start; } }
.head { display: flex; align-items: center; gap: 10px; margin: 0; color: var(--text-muted); font-size: .75rem; }
.slots { display: inline-flex; gap: 3px; }
.slots i { width: 14px; height: 6px; border-radius: 2px; background: rgba(255,255,255,.1); }
.slots i.on { background: var(--live); }
.slots i.me { background: var(--tally); }
.strip { display: flex; gap: 10px; }
.thumb { flex: none; }
.thumb { position: relative; width: 128px; border: 0; padding: 0; background: none; border-radius: 8px; cursor: pointer; }
.thumb .tv { display: block; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; position: relative; }
/* The hover ring is drawn inside, so the scrolling strip never clips it. */
.thumb .tv::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); pointer-events: none; }
.thumb:hover .tv::after, .thumb:focus-visible .tv::after { box-shadow: inset 0 0 0 2px var(--tally); }
.thumb:focus-visible { outline: none; }
.chip { position: absolute; left: 5px; bottom: 5px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px 2px 3px; border-radius: 999px; background: rgba(8,10,14,.72); font-size: .6875rem; }
.chip .av { width: 16px; height: 16px; font-size: .5rem; box-shadow: none; }
.free { flex: none; width: 128px; aspect-ratio: 16/9; display: grid; place-content: center; gap: 3px; border: 1px dashed var(--line); border-radius: 8px; text-align: center; }
.free b { font-family: var(--font-mono); font-weight: 500; font-size: .75rem; color: var(--text-muted); }
.free span { font-size: .6875rem; color: var(--text-faint); }
.share { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--tally) 45%, transparent); background: transparent; color: var(--tally); font-size: .75rem; font-weight: 600; cursor: pointer; }
.share:hover { background: color-mix(in srgb, var(--tally) 14%, transparent); }
.note { position: fixed; right: 12px; top: 96px; max-width: 320px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; background: rgba(5,7,10,.85); color: var(--text-muted); font-size: .75rem; line-height: 1.45; z-index: 70; }
.note b { color: var(--text); }
.note .x { float: right; margin: -4px -4px 0 8px; border: 0; background: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }
.note.hide { display: none; }
</style>

<div class="switcher">
  <strong>#107 · round 5</strong>
  <span class="group" id="g-pic"><span>Picture</span></span>
  <span class="group" id="g-tall"><span>Tall pictures</span></span>
  <span class="group" id="g-people"><span>Live</span></span>
</div>
<header class="header"><div class="logo">xovê<span>.</span></div><div class="ghost"></div><div style="width:120px"></div></header>
<div class="middle" id="middle">
  <div class="column" id="column">
    <div class="stagebox" id="stagebox">
      <div class="light" id="light"></div>
      <div class="stage" id="stage"></div>
    </div>
    <div class="info" id="info"></div>
  </div>
</div>
<footer class="footer">xovê · Made by Hbrauveres</footer>
<div class="note" id="note"></div>

<script>
const PICS = {
  "16:9 game": { r: 16/9, bg: "linear-gradient(180deg,#2c4a7a 0 45%,#c76b3a 45% 52%,#3b2a24 52%)", edge: "#c76b3a" },
  "Steam (1.84:1)": { r: 1.84, bg: "radial-gradient(circle at 50% 30%,#e98a3c 0 20%,transparent 40%),linear-gradient(180deg,#1b2838 0 9%,#4a2a1c 9%)", edge: "#d0762f" },
  "Ultrawide 21:9": { r: 21/9, bg: "linear-gradient(90deg,#173b2f,#2f7a5a 50%,#173b2f)", edge: "#2f7a5a" },
  "Portrait monitor": { r: 9/16, bg: "linear-gradient(160deg,#cfcac0 0 30%,#3a3d3a 30% 60%,#121412 60%)", edge: "#8d8a82" },
  "Square window": { r: 1.1, bg: "linear-gradient(135deg,#5b3b8c,#2a5c9a)", edge: "#4a4f9a" },
};
const P = { B: { n: "Bruno", c: "hsl(330 42% 38%)" }, A: { n: "Ana", c: "hsl(150 42% 38%)" }, D: { n: "Diego", c: "hsl(255 42% 38%)" }, H: { n: "Henrique", c: "hsl(35 42% 38%)" } };
const state = { pic: "Steam (1.84:1)", tall: "Hug", people: "3 live" };

function group(id, key, opts) {
  const g = document.getElementById(id);
  for (const o of opts) {
    const b = document.createElement("button");
    b.className = "sbtn"; b.textContent = o;
    b.onclick = () => { state[key] = o; render(); };
    b.dataset.key = key; b.dataset.val = o; g.append(b);
  }
}
group("g-pic", "pic", Object.keys(PICS));
group("g-tall", "tall", ["Hug"]);
group("g-people", "people", ["Nobody", "1 live (you)", "3 live"]);

const av = (k, cls = "") => `<span class="av ${cls}" style="background:${P[k].c}">${k}</span>`;
const icon = {
  screen: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>`,
  cam: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg>`,
};

function layout() {
  const m = document.getElementById("middle");
  const cs = getComputedStyle(document.documentElement);
  const edge = parseFloat(cs.getPropertyValue("--edge")), infoH = parseFloat(cs.getPropertyValue("--info-h")), gap = parseFloat(cs.getPropertyValue("--gap"));
  const W = m.clientWidth - 2 * edge, H = m.clientHeight - infoH - gap - 8;
  // The column is the 16:9 box the stage may use; the stage takes the picture's shape inside it.
  const colW = Math.min(W, H * 16 / 9), colH = colW * 9 / 16;
  const empty = state.people === "Nobody";
  const pic = PICS[state.pic];
  let r = empty ? 16 / 9 : pic.r;
  let sw, sh;
  if (!empty && state.tall === "Blurred fill" && r < 16 / 9) { sw = colW; sh = colH; }
  else if (r >= 16 / 9) { sw = colW; sh = colW / r; }
  else { sh = colH; sw = colH * r; }
  document.getElementById("column").style.width = colW + "px";
  const box = document.getElementById("stagebox"); box.style.height = sh + "px";
  const st = document.getElementById("stage"); st.style.width = sw + "px"; st.style.height = sh + "px";
  const li = document.getElementById("light");
  li.style.width = sw * 1.12 + "px"; li.style.height = sh * 1.3 + "px";
  li.style.background = empty ? "transparent" : pic.edge;
}

function render() {
  document.querySelectorAll(".sbtn").forEach((b) => b.setAttribute("aria-pressed", state[b.dataset.key] === b.dataset.val));
  const empty = state.people === "Nobody", pic = PICS[state.pic];
  const fill = !empty && state.tall === "Blurred fill" && pic.r < 16 / 9;
  const st = document.getElementById("stage");
  st.innerHTML = empty
    ? `<div class="empty">${"<i></i>".repeat(7)}</div><div class="rbtns"><span class="rbtn">${icon.screen}</span><span class="rbtn">${icon.cam}</span></div>`
    : (fill ? `<div class="blurfill" style="background:${pic.bg}"></div><div class="pic" style="background:${pic.bg};left:50%;right:auto;width:${(pic.r * 9 / 16) * 100}%;transform:translateX(-50%)"></div>` : `<div class="pic" style="background:${pic.bg}"></div>`)
      + `<div class="rbtns"><span class="rbtn on">${icon.screen}</span><span class="rbtn">${icon.cam}</span></div>`;

  const info = document.getElementById("info");
  if (empty) {
    info.innerHTML = `
      <div class="now invite">
        <div>
          <h2 class="title">The stage is <em>yours</em>.</h2>
          <p><span class="stack">${av("B", "sm")}${av("A", "sm")}${av("D", "sm")}</span> Bruno, Ana and Diego are here, waiting for someone to go live.</p>
        </div>
      </div>
      <div class="also"><div class="strip"><div class="free"><b>0 of 6 live</b><span>6 free · share yours</span></div></div></div>`;
  } else if (state.people === "1 live (you)") {
    info.innerHTML = `
      <div class="now">
        ${av("H", "ring")}
        <div style="min-width:0">
          <h2 class="name">You</h2>
          <p class="meta"><span class="badge">LIVE</span><span>Sharing your screen</span><span class="elapsed">1:20</span><span class="sep"></span><span class="watchers"><span class="stack">${av("B", "sm")}${av("A", "sm")}</span><span class="wtext">2 watching</span></span></p>
        </div>
      </div>
      <div class="also"><div class="strip"><div class="free"><b>1 of 6 live</b><span>5 free · share yours</span></div></div></div>`;
  } else {
    info.innerHTML = `
      <div class="now">
        ${av("B", "ring")}
        <div style="min-width:0">
          <h2 class="name">Bruno</h2>
          <p class="meta"><span class="badge">LIVE</span><span>Screen with camera</span><span class="elapsed">12:44</span><span class="sep"></span><span class="watchers"><span class="stack">${av("H", "sm")}${av("D", "sm")}</span><span class="wtext">2 watching</span></span></p>
        </div>
      </div>
      <div class="also">
        <div class="strip">
          <div class="scroll"><button class="thumb"><span class="tv" style="background:linear-gradient(160deg,#1e6b52,#123a33)"></span><span class="chip">${av("A")} Ana · screen</span></button>
          <button class="thumb"><span class="tv" style="background:linear-gradient(160deg,#4b4f9a,#23264a)"></span><span class="chip">${av("D")} Diego · camera</span></button></div>
          <div class="free"><b>3 of 6 live</b><span>3 free · share yours</span></div>
        </div>
      </div>`;
  }
  const notes = {
    "Hug": "<b>Hug:</b> the stage takes the picture's shape, inside the same space as today. Wide windows give a shorter stage, tall ones a narrower stage. The light hugs it too. No bars, ever.",
    "Blurred fill": "<b>Blurred fill:</b> only for pictures taller than 16:9. The stage stays 16:9; the sides show a blurred, darkened copy of the picture instead of black. Wide pictures still hug.",
  };
  document.getElementById("note").innerHTML = `<button class="x" aria-label="Hide the note" onclick="this.parentNode.classList.add('hide')">×</button>` + notes[state.tall] + "<br><br><b>Info row:</b> the ring sits inside the avatar, so its edge lines up with the stage. A filled LIVE badge, who's watching, no \"Also live\" title: the count sits in the free box, and both sides share one height. An invitation when the stage is empty.";
  layout();
}
addEventListener("resize", layout);
render();
</script>
