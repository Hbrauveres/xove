<title>Xovê Room Layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Xovê's room in theater mode, round nine. A full-width header (logo left; the latest activity, and the connection, in the middle; people and account right) and a slim footer frame the page, both see-through; between them, the stage and its info row as one centred column. Ambilight LEDs glow behind everything, and every element sits on top of them. Single dark look, Xovê's own tokens. */
:root {
  color-scheme: dark;
  --ground: #0b0e13;
  --surface: #151b24;
  --surface-raised: #1c2430;
  --panel: #10141b;
  --line: #222b38;
  --text: #e7ebf1;
  --text-muted: #8b96a8;
  --text-faint: #5d6778;
  --tally: #f2a93b;
  --tally-ink: #1a1206;
  --live: #ef4b4b;
  --ok: #3fbf7f;
  --warn: #e0b341;
  --glass: rgba(8, 10, 14, 0.72);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --edge: 24px;      /* the page's side margin: header, footer and the stage's minimum */
  --info-h: 104px;   /* the info row under the stage */
  --gap: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--font-body); font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: inherit; }

/* ---- the draft controls (not part of the app) ---- */
.switcher { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 7px 16px; background: #05070a; border-bottom: 1px dashed var(--line); font-size: .8125rem; color: var(--text-muted); position: relative; z-index: 60; }
.switcher strong { color: var(--text); font-family: var(--font-display); font-size: .95rem; }
.switcher label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.switcher input { accent-color: var(--tally); }
.sbtn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: .75rem; color: var(--text-muted); cursor: pointer; }
.sbtn:hover { border-color: var(--tally); color: var(--tally); }
.fps { font-family: var(--font-mono); font-size: .6875rem; color: var(--text-faint); }

/* ---- header: full width, solid, above the light ---- */
.header { position: relative; z-index: 20; flex: none; height: 60px; padding: 0 var(--edge); display: grid; grid-template-columns: 1fr minmax(0, auto) 1fr; align-items: center; gap: 16px; }
.logo { justify-self: start; font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; line-height: 1; letter-spacing: -.03em; }
.logo span { color: var(--tally); }
.right { justify-self: end; display: flex; align-items: center; gap: 4px; }
.wrap { position: relative; }
.hbtn { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; color: var(--text-muted); }
.hbtn:hover, .hbtn[aria-expanded="true"] { background: rgba(255,255,255,.08); color: var(--text); }
.hbtn:focus-visible, .ticker:focus-visible, .thumb:focus-visible { outline: 2px solid var(--tally); outline-offset: 2px; }
.count { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }

.avatar { position: relative; flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .75rem; color: #fff; }
.avatar.xs { width: 22px; height: 22px; font-size: .625rem; }
.avatar.lg { width: 44px; height: 44px; font-size: .9375rem; }
.avatar.ring { box-shadow: 0 0 0 2px var(--ground), 0 0 0 4px var(--tally); }
.avatar .dot { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--ground); background: var(--ok); }
.avatar .dot.bad { background: var(--warn); }

/* ---- the centre: the latest thing that happened, always current ---- */
.ticker { position: relative; display: inline-flex; align-items: center; gap: 10px; height: 38px; width: min(440px, 40vw); padding: 0 12px 0 8px; border: 1px solid rgba(255,255,255,.08); border-radius: 999px; background: rgba(16, 20, 27, .72); backdrop-filter: blur(10px); cursor: pointer; overflow: hidden; transition: border-color .2s, background .2s; }
/* The connection, when it drops, takes the pill: amber, with a spinner. */
.ticker.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: color-mix(in srgb, var(--warn) 14%, rgba(16, 20, 27, .85)); color: var(--warn); }
.ticker .spin { flex: none; margin-left: 4px; }
.ticker:hover, .ticker[aria-expanded="true"] { border-color: color-mix(in srgb, var(--tally) 55%, var(--line)); }
.tick { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.ticker .bell { flex: none; margin-left: 4px; color: var(--text-muted); }
.ticker.warn .bell { display: none; }
.tick.enter { animation: tick-in .35s ease; }
@keyframes tick-in { from { transform: translateY(14px); opacity: 0; } }
.tick .what { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.tick time { font-family: var(--font-mono); font-size: .6875rem; color: var(--text-faint); white-space: nowrap; }
.new { flex: none; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--tally); color: var(--tally-ink); font-size: .625rem; font-weight: 700; display: grid; place-items: center; }
.new[hidden] { display: none; }
.chev { flex: none; color: var(--text-muted); }

/* ---- floating rounded panels ---- */
.float {
  position: absolute; top: calc(100% + 8px); width: 340px; z-index: 30; color: var(--text);
  /*
   * Unrolls downward when it opens, rolls back up when it closes, by animating its height.
   * (Not a clip or a fade on the card: those stop the browser from blurring what's behind.)
   */
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows .26s cubic-bezier(.2, .8, .2, 1);
}
.float.open { grid-template-rows: 1fr; }
/* Frosted sections stacked with a clear 2px cut between them: the divider is the page behind, sharp. */
.roll { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 2px; border-radius: 16px; }
.float.end { right: 0; }
.float.mid { left: 50%; width: min(440px, 92vw); transform: translateX(-50%); }
.float[hidden] { display: none; }
.sec {
  background: rgba(9, 12, 17, 0.74);
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-block-width: 0;
}
.sec:first-child { border-top-width: 1px; border-radius: 16px 16px 0 0; }
.sec:last-child { border-bottom-width: 1px; border-radius: 0 0 16px 16px; }
.sec:only-child { border-radius: 16px; }
.sec.scroll { max-height: min(56vh, 440px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.22) transparent; }
.sec.scroll::-webkit-scrollbar { width: 8px; }
.sec.scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
.sec.scroll::-webkit-scrollbar-track { background: transparent; }
/* Sections keep their full size while the card unrolls: only the card's edge reveals them. */
.roll > .sec { flex: none; }
.sec.head { padding: 14px 16px 12px; }
.sec.head h2 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; }
.seats { display: grid; gap: 6px; }
.seats .line { display: flex; justify-content: space-between; font-size: .75rem; color: #c3ccd8; font-weight: 500; }
.seats .line b { color: var(--text); font-variant-numeric: tabular-nums; }
.seatbar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.seatbar i { display: block; height: 100%; border-radius: inherit; background: var(--ok); }
.sec.foot { padding: 10px 16px 12px; color: #aab4c4; font-size: .75rem; font-weight: 500; }
.people { list-style: none; margin: 0; padding: 8px; display: grid; gap: 2px; }
.person { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; }
.person:hover { background: rgba(255,255,255,.06); }
.person .n { min-width: 0; }
.person .n b { font-weight: 700; }
.person .n .you { color: #9aa5b6; font-weight: 500; }
.person .n small { display: block; color: #aab4c4; font-weight: 500; font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icons { display: inline-flex; gap: 4px; }
.ic { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: color-mix(in srgb, var(--tally) 18%, transparent); color: var(--tally); }
.menu .sec { padding: 6px; }
.menu .who { display: flex; gap: 10px; align-items: center; padding: 8px 10px 10px; }
.menu .who b { font-weight: 700; }
.menu .who small { display: block; color: #aab4c4; font-weight: 500; }
.menu .status { display: flex; align-items: center; gap: 8px; padding: 2px 10px 8px; color: #c3ccd8; font-size: .8125rem; font-weight: 500; }
.menu .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.menu .item { display: flex; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; font-weight: 600; }
.menu .item:hover, .menu .item:focus-visible { background: var(--tally); color: var(--tally-ink); outline: none; }
.feed { list-style: none; margin: 0; padding: 8px; display: grid; gap: 2px; }
.ev { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; font-size: .8125rem; font-weight: 500; color: #c9d1dc; }
.ev.unseen { background: color-mix(in srgb, var(--tally) 12%, transparent); color: #fff; }
.ev .k { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: rgba(255,255,255,.08); color: #c3ccd8; }
.ev .k.on { background: color-mix(in srgb, var(--tally) 18%, transparent); color: var(--tally); }
/* An event about a stream that's still live: click it to watch that stream. */
.ev.link { width: 100%; border: 0; background: transparent; text-align: left; cursor: pointer; font: inherit; font-size: .8125rem; font-weight: 500; color: #c9d1dc; }
.ev.link.unseen { background: color-mix(in srgb, var(--tally) 12%, transparent); color: #fff; }
.ev.link:hover, .ev.link:focus-visible { background: rgba(255,255,255,.08); color: #fff; outline: none; }
.ev.link:focus-visible { box-shadow: inset 0 0 0 2px var(--tally); }
.ev .act { display: none; font-family: var(--font-mono); font-size: .625rem; letter-spacing: .08em; padding: 3px 7px; border-radius: 999px; background: var(--tally); color: var(--tally-ink); }
.ev.link:hover .act, .ev.link:focus-visible .act, .ev .act.on { display: inline-block; }
.ev.link:hover time, .ev.link:focus-visible time, .ev.watching time { display: none; }
.feed li { list-style: none; }
.ev time { font-family: var(--font-mono); font-size: .6875rem; color: #9aa5b6; white-space: nowrap; }

/* ---- the middle of the page: stage and info, one centred column ---- */
.main { flex: 1; min-height: 0; container-type: size; display: flex; justify-content: center; padding: 0 var(--edge); }
.column { width: min(100cqw - 2 * var(--edge), (100cqh - var(--info-h) - var(--gap)) * 16 / 9); display: flex; flex-direction: column; justify-content: center; min-height: 0; }

.stage { position: relative; flex: none; width: 100%; aspect-ratio: 16 / 9; }
/*
 * The LEDs: one small canvas, the soft falloff already painted into it, stretched a little
 * past the frame by the GPU. No CSS blur: nothing big gets repainted when the colours change.
 */
.leds { position: absolute; z-index: 0; opacity: .9; transition: opacity .5s ease; pointer-events: none; }
.leds.off { opacity: 0; }
.screen { position: absolute; inset: 0; z-index: 1; border-radius: 12px; overflow: hidden; background: #000; }
.screen canvas { width: 100%; height: 100%; display: block; }
.ov { position: absolute; inset: 0; padding: 12px; pointer-events: none; display: flex; justify-content: flex-end; }
.fs { width: 34px; height: 34px; border-radius: 50%; background: var(--glass); display: grid; place-items: center; }
.row { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; gap: 12px; }
.rb { height: 48px; min-width: 48px; border-radius: 999px; background: var(--glass); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 999px; background: color-mix(in srgb, var(--warn) 18%, var(--panel)); color: var(--warn); font-size: .8125rem; z-index: 6; border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner[hidden] { display: none; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.info { position: relative; z-index: 2; flex: none; height: var(--info-h); margin-top: var(--gap); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 24px; }
.now { display: flex; align-items: center; gap: 14px; min-width: 0; }
.now h1 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now p { margin: 4px 0 0; color: var(--text-muted); font-size: .8125rem; display: flex; gap: 10px; align-items: center; white-space: nowrap; }
.live { font-family: var(--font-mono); font-size: .6875rem; letter-spacing: .08em; color: var(--live); display: inline-flex; align-items: center; gap: 5px; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.mono { font-family: var(--font-mono); font-size: .75rem; color: var(--text-faint); }
.also { display: grid; gap: 8px; justify-items: end; min-width: 0; max-width: 100%; }
.also-h { display: flex; gap: 10px; align-items: baseline; font-size: .75rem; color: var(--text-muted); }
.also-h b { font-family: var(--font-mono); font-weight: 500; color: var(--text-faint); }
.strip { display: flex; gap: 10px; overflow-x: auto; max-width: 100%; }
.thumb { position: relative; flex: none; width: 128px; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 8px; }
.thumb .v { display: block; aspect-ratio: 16/9; border-radius: 8px; }
.thumb .v::after { content: ""; position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.thumb:hover .v::after { box-shadow: inset 0 0 0 2px var(--tally); }
.thumb .cap { position: absolute; left: 5px; bottom: 5px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px 2px 3px; border-radius: 999px; background: var(--glass); font-size: .6875rem; }
.thumb .cap .avatar { width: 16px; height: 16px; font-size: .5625rem; }
.free { flex: none; width: 128px; aspect-ratio: 16/9; border-radius: 8px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--text-faint); font-size: .6875rem; text-align: center; padding: 6px; }

/* ---- footer: full width, solid, the same edges as the header ---- */
.footer { position: relative; z-index: 20; flex: none; height: 40px; padding: 0 var(--edge); display: flex; align-items: center; justify-content: space-between; gap: 16px; color: var(--text-faint); font-size: .75rem; }
.footer .links { display: flex; align-items: center; gap: 18px; }
.footer a { text-decoration: none; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; }
.footer a:hover { color: var(--text); }
.footer .coffee { color: var(--tally); }
.footer .coffee:hover { color: var(--tally); text-decoration: underline; }

.toast { position: fixed; right: 16px; bottom: 56px; display: flex; gap: 10px; align-items: center; background: var(--surface-raised); border: 1px solid var(--line); border-left: 3px solid var(--tally); border-radius: 10px; padding: 10px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); font-size: .8125rem; z-index: 40; animation: rise .2s ease; }
.toast[hidden] { display: none; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }

@media (max-width: 760px) {
  :root { --edge: 12px; --info-h: 168px; }
  .header { grid-template-columns: auto 1fr auto; }
  .ticker { width: 100%; }
  .info { grid-template-columns: 1fr; align-content: start; gap: 12px; }
  .also { justify-items: start; }
  .float, .float.mid { position: fixed; left: 8px; right: 8px; top: 72px; width: auto; transform: none; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { .spin, .toast, .live::before, .tick.enter { animation: none; } .leds, .float { transition: none; } }
</style>

<div class="switcher" role="group" aria-label="Draft controls">
  <strong>Theater, round nine</strong>
  <label><input type="checkbox" id="opt-leds" checked> Ambilight</label>
  <label><input type="checkbox" id="opt-reconnect"> Connection drops</label>
  <button type="button" class="sbtn" id="opt-join">Someone joins</button>
  <button type="button" class="sbtn" id="opt-share">Someone starts sharing</button>
  <span class="fps" id="cost"></span>
</div>

<header class="header">
  <div class="logo">xovê<span>.</span></div>

  <div class="wrap">

    <div class="float mid" id="feed-pop" role="dialog" aria-label="Activity" hidden>
      <div class="roll"><div class="sec scroll"><ul class="feed" id="feed"></ul></div></div>
    </div>
  </div>

  <div class="right">
    <div class="wrap">
      <button type="button" class="hbtn" id="people-btn" aria-expanded="false" aria-haspopup="dialog">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="7.5" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2 16c.6-2.8 2.8-4.3 5.5-4.3S12.4 13.2 13 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="14" cy="6.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M14.5 11.3c1.9.3 3.1 1.6 3.5 3.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>

</header>

<main class="main">
  <div class="column">
    <div class="stage">
      <canvas class="leds" id="leds" aria-hidden="true"></canvas>
      <div class="screen">
        <canvas id="canvas" width="960" height="540"></canvas>
        <div class="ov"><span class="fs"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></div>
        <div class="row" aria-hidden="true">
          <span class="rb"><svg viewBox="0 0 20 20" width="22" height="22"><path d="M3 8h3l4-3v10l-4-3H3z" fill="currentColor"/><path d="M13 7.5a3.5 3.5 0 0 1 0 5M15 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          <span class="rb"><svg viewBox="0 0 20 20" width="22" height="22"><path d="M3 4.5h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM7 17.5h6M10 14.5v3M3 3l14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
          <span class="rb"><svg viewBox="0 0 20 20" width="22" height="22"><path d="M3 6h9a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM13 9l5-3v8l-5-3M3 3l14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg></span>
          <span class="rb"><svg viewBox="0 0 20 20" width="22" height="22"><path d="M10 7.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
        </div>
      </div>

    <section class="info" aria-label="Now watching">
      <div class="now">
        <span class="avatar lg ring" id="now-av"></span>
        <div style="min-width:0">
          <h1 id="now-name"></h1>
          <p><span class="live">LIVE</span><span id="now-what"></span><span class="mono" id="now-time"></span></p>
        </div>
      </div>
      <div class="also">
        <div class="also-h"><span>Also live</span><b id="live-count"></b></div>
        <div class="strip" id="strip"></div>
      </div>
    </section>
  </div>
</main>

    <a class="coffee" href="#" onclick="return false">☕ Buy me a coffee</a>

<div class="toast" id="toast" hidden><span class="avatar xs" id="toast-av">C</span><span id="toast-text"></span></div>

<script>
const SEATS = 20, MAX_STREAMS = 6;
const PEOPLE = [
  { id: "b", name: "Bruno", color: "#3c6b8f", note: "Sharing screen and camera" },
  { id: "a", name: "Ana", color: "#8f3c6b", note: "Sharing a window" },
  { id: "h", name: "Henrique", color: "#7a5a2c", you: true, note: "Watching Bruno" },
  { id: "d", name: "Diego", color: "#4f5f2c", note: "Watching Ana" },
];
const STREAMS = [
  { id: "bs", who: "b", what: "screen", label: "Screen", with: "with camera", since: "12:40", sky: ["#1c3a7a", "#7a2f6f"], sun: "#ffaa28" },
  { id: "as", who: "a", what: "screen", label: "Window", since: "2:15", sky: ["#0d5c58", "#2f8a3c"], sun: "#8cffbe" },
  { id: "bc", who: "b", what: "camera", label: "Camera", since: "11:02", sky: ["#8a2f4f", "#b5452a"], sun: "#ffd278" },
];
// One place for everything that happens: shares, cameras, people coming and going.
const EVENTS = [
  { who: "a", kind: "share", stream: "as", text: "Ana started sharing a window", at: "2 min" },
  { who: "b", kind: "camera", stream: "bc", text: "Bruno turned on their camera", at: "6 min" },
  { who: "d", kind: "join", text: "Diego joined", at: "9 min" },
  { who: "b", kind: "share", stream: "bs", text: "Bruno started sharing", at: "13 min" },
  { who: "h", kind: "join", text: "You joined", at: "15 min" },
];
const $ = (id) => document.getElementById(id);
let watching = "bs";
let unseen = 0;
const person = (id) => PEOPLE.find((p) => p.id === id);
const stream = () => STREAMS.find((s) => s.id === watching);
const svg = {
  share: '<svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path d="M3 4.5h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM7 17.5h6M10 14.5v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  camera: '<svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path d="M3 6h9a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM13 9l5-3v8l-5-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  join: '<svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path d="M8 10h9M13 6l4 4-4 4M8 3H4v14h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  leave: '<svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path d="M17 10H8M12 6l-4 4 4 4M12 3h4v14h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bell: '<svg class="bell" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 13V9a5 5 0 0 1 10 0v4l1.5 2h-13zM8 17a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
};
const av = (p, cls = "xs") => `<span class="avatar ${cls}" style="background:${p.color}">${p.name[0]}</span>`;

let reconnecting = false;
function renderTicker(animate) {
  $("ticker").classList.toggle("warn", reconnecting);
  if (reconnecting) {
    $("ticker").innerHTML = `<span class="tick enter"><span class="spin" aria-hidden="true"></span><span class="what">Connection dropped. Reconnecting…</span></span>${svg.chev}`;
    $("ticker").setAttribute("aria-label", "Connection dropped. Reconnecting");
    return;
  }
  const e = EVENTS[0], p = person(e.who);
  $("ticker").innerHTML = `${svg.bell}<span class="tick${animate ? " enter" : ""}">${av(p)}<span class="what">${e.text}</span><time>${e.at}</time></span><span class="new" ${unseen ? "" : "hidden"}>${unseen}</span>${svg.chev}`;
  $("ticker").setAttribute("aria-label", `Activity: ${e.text}, ${e.at} ago${unseen ? `, ${unseen} new` : ""}`);
  $("feed").innerHTML = EVENTS.map((ev, i) => {
    const on = ev.kind === "share" || ev.kind === "camera";
    const isNew = i < unseen ? " unseen" : "";
    const icon = `<span class="k${on ? " on" : ""}">${svg[ev.kind]}</span>`;
    // Still live: a button that puts it on the stage. Ended (or not a stream): plain text.
    if (ev.stream && STREAMS.some((x) => x.id === ev.stream)) {
      const now = ev.stream === watching;
      return `<li><button type="button" class="ev link${isNew}${now ? " watching" : ""}" data-stream="${ev.stream}" aria-label="${ev.text}: ${now ? "watching" : "watch"}">${icon}<span>${ev.text}</span><span class="act${now ? " on" : ""}">${now ? "WATCHING" : "WATCH"}</span><time>${ev.at}</time></button></li>`;
    }
    return `<li class="ev${isNew}">${icon}<span>${ev.text}</span><time>${ev.at}</time></li>`;
  }).join("");
  $("feed").querySelectorAll(".ev.link").forEach((b) => b.onclick = (e) => {
    e.stopPropagation();
    watching = b.dataset.stream;
    renderInfo();
    renderTicker(false);
    closeAll();
  });
}

function renderInfo() {
  const s = stream(), p = person(s.who);
  $("now-av").textContent = p.name[0];
  $("now-av").style.background = p.color;
  $("now-name").textContent = p.name;
  $("now-what").textContent = `${s.label}${s.with ? " " + s.with : ""}`;
  $("now-time").textContent = s.since;
  $("live-count").textContent = `${STREAMS.length} of ${MAX_STREAMS}`;
  const others = STREAMS.filter((x) => x.id !== watching && !(x.who === s.who && x.what === "camera"));
  const free = MAX_STREAMS - STREAMS.length;
  $("strip").innerHTML = others.map((x) => {
    const o = person(x.who);
    return `<button type="button" class="thumb" data-id="${x.id}" aria-label="Watch ${o.name}'s ${x.label.toLowerCase()}">
      <span class="v" style="background:linear-gradient(135deg,${x.sky[0]},${x.sky[1]})"></span>
      <span class="cap"><span class="avatar" style="background:${o.color}">${o.name[0]}</span>${o.name} · ${x.label.toLowerCase()}</span>
    </button>`;
  }).join("") + (free > 0 ? `<span class="free">${free} free · share yours</span>` : "");
  $("strip").querySelectorAll(".thumb").forEach((b) => b.onclick = () => { watching = b.dataset.id; renderInfo(); renderTicker(false); });
}

function renderPeople() {
  const used = PEOPLE.length;
  $("people-count").textContent = String(used);
  $("people-btn").setAttribute("aria-label", `${used} people here`);
  $("people-pop").innerHTML = `<div class="roll">
    <div class="sec head">
      <div class="seats">
        <div class="line"><span>Seats</span><span><b>${used}</b> of ${SEATS} · ${SEATS - used} free</span></div>
        <div class="seatbar"><i style="width:${(used / SEATS) * 100}%"></i></div>
      </div>
    </div>
    <div class="sec scroll"><ul class="people">${PEOPLE.map((p) => {
      const mine = STREAMS.filter((s) => s.who === p.id);
      return `<li class="person">
        ${av(p, mine.length ? "ring" : "")}
        <span class="n"><b>${p.name}</b>${p.you ? ' <span class="you">(you)</span>' : ""}<small>${p.note}</small></span>
        <span class="icons">${mine.map((s) => `<span class="ic" title="${s.label}">${s.what === "camera" ? svg.camera : svg.share}</span>`).join("")}</span>
      </li>`;
    }).join("")}</ul></div>
    <div class="sec foot">Nobody is waiting for a seat.</div></div>`;
}

// Opening shows the panel, then unrolls it; closing rolls it up, then hides it.
function openPop(pop) {
  clearTimeout(pop._hide);
  pop.hidden = false;
  void pop.offsetHeight; // start from the rolled-up state
  pop.classList.add("open");
}
function closePop(pop) {
  if (pop.hidden || !pop.classList.contains("open")) return;
  pop.classList.remove("open");
  pop._hide = setTimeout(() => (pop.hidden = true), 260);
}
function closeAll(except) {
  document.querySelectorAll(".float").forEach((f) => f !== except && closePop(f));
  document.querySelectorAll("[aria-expanded]").forEach((b) => b.setAttribute("aria-expanded", "false"));
}
function toggle(btnId, popId, onOpen) {
  $(btnId).onclick = (e) => {
    e.stopPropagation();
    const pop = $(popId);
    const open = !pop.classList.contains("open");
    closeAll(pop);
    if (open) openPop(pop); else closePop(pop);
    $(btnId).setAttribute("aria-expanded", String(open));
    if (open && onOpen) onOpen();
  };
}
toggle("ticker", "feed-pop", () => { setTimeout(() => { unseen = 0; renderTicker(false); }, 1500); });
toggle("people-btn", "people-pop");
toggle("me-btn", "me-pop");
document.addEventListener("click", (e) => { if (!e.target.closest(".float")) closeAll(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAll(); });

function happen(ev) {
  EVENTS.unshift(ev);
  unseen += 1;
  renderTicker(true);
  renderPeople();
}
let n = 0;
$("opt-join").onclick = (e) => {
  e.stopPropagation();
  const names = ["Carla", "Rafa", "Lu"];
  const name = names[n++ % names.length];
  PEOPLE.push({ id: "n" + n, name, color: "#2f7a5a", note: "Watching Bruno" });
  happen({ who: "n" + n, kind: "join", text: `${name} joined`, at: "now" });
};
$("opt-share").onclick = (e) => {
  e.stopPropagation();
  if (!STREAMS.some((x) => x.id === "ds") && STREAMS.length < MAX_STREAMS) {
    STREAMS.push({ id: "ds", who: "d", what: "screen", label: "Screen", since: "0:01", sky: ["#5c3a0d", "#8a6a2f"], sun: "#ffe08c" });
    person("d").note = "Sharing their screen";
    renderInfo();
  }
  happen({ who: "d", kind: "share", stream: "ds", text: "Diego started sharing", at: "now" });
};
$("opt-reconnect").onchange = (e) => {
  const bad = e.target.checked;
  reconnecting = bad;
  $("me-dot").classList.toggle("bad", bad);
  $("me-status").innerHTML = bad ? '<i style="background:var(--warn)"></i>Reconnecting…' : "<i></i>Connected";
  if (bad) renderTicker(true);
  else happen({ who: "h", kind: "join", text: "Reconnected", at: "now" });
};

/* ---- the stand-in stream (cheap to draw, so it doesn't hide the LEDs' cost) ---- */
const canvas = $("canvas"), ctx = canvas.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function drawStream(t) {
  const w = canvas.width, h = canvas.height, s = stream();
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, s.sky[0]); g.addColorStop(1, s.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = s.sun;
  ctx.beginPath(); ctx.arc(w / 2 + Math.sin(t / 2500) * w * 0.44, h * 0.22 + Math.cos(t / 3100) * h * 0.12, h * 0.15, 0, Math.PI * 2); ctx.fill();
  for (let layer = 0; layer < 3; layer++) {
    ctx.fillStyle = ["#2b2540", "#201b30", "#141019"][layer];
    ctx.beginPath(); ctx.moveTo(0, h);
    for (let x = 0; x <= w; x += 24) {
      const y = h * 0.76 + layer * h * 0.08 + Math.sin((x * 1.33 + t * (0.02 + layer * 0.03)) / (90 - layer * 20)) * (30 - layer * 6);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, h); ctx.fill();
  }
}

/*
 * ---- ambilight, round two: cheaper and sharper ----
 * 1. ~12 times a second the picture is drawn into a 64×36 canvas and read back (2 304 pixels).
 * 2. Its edges give 200 LEDs: 64 along the top and bottom, 36 down each side, each averaged
 *    with the pixel next to it inward so a single bright pixel doesn't flash.
 * 3. LEDs ease towards their new colour, so the light breathes instead of flickering.
 * 4. They're painted into a small canvas with the falloff built in (each LED is a gradient
 *    fading outward on a soft curve) and a 3 px blur at that tiny size. The page only stretches
 *    that image: no full-screen blur, so a 2K or 4K monitor costs the same.
 */
const COLS = 64, ROWS = 36, SPREAD = 16;        // SPREAD: how far the light reaches, in LED cells (about 40% of the stage's height)
const sample = document.createElement("canvas");
sample.width = COLS; sample.height = ROWS;
const sctx = sample.getContext("2d", { willReadFrequently: true });
const leds = $("leds");
leds.width = COLS + SPREAD * 2; leds.height = ROWS + SPREAD * 2;
// The canvas's middle maps exactly onto the stage, so each LED glows from its own spot on the frame.
Object.assign(leds.style, {
  left: `${(-SPREAD / COLS) * 100}%`, width: `${((COLS + SPREAD * 2) / COLS) * 100}%`,
  top: `${(-SPREAD / ROWS) * 100}%`, height: `${((ROWS + SPREAD * 2) / ROWS) * 100}%`,
});
const lctx = leds.getContext("2d");
const raw = document.createElement("canvas");
raw.width = leds.width; raw.height = leds.height;
const rctx = raw.getContext("2d");
const N = COLS * 2 + ROWS * 2;
const col = new Float32Array(N * 3);
let primed = false, last = 0, ledsOn = true, cost = 0;

function sampleEdges() {
  const t0 = performance.now();
  sctx.drawImage(canvas, 0, 0, COLS, ROWS);
  const px = sctx.getImageData(0, 0, COLS, ROWS).data;
  const k = primed ? 0.3 : 1;
  let i = 0;
  const take = (x, y, dx, dy) => {
    const a = (y * COLS + x) * 4, b = ((y + dy) * COLS + (x + dx)) * 4;
    for (let c = 0; c < 3; c++, i++) col[i] += ((px[a + c] + px[b + c]) / 2 - col[i]) * k;
  };
  for (let x = 0; x < COLS; x++) take(x, 0, 0, 1);
  for (let x = 0; x < COLS; x++) take(x, ROWS - 1, 0, -1);
  for (let y = 0; y < ROWS; y++) take(0, y, 1, 0);
  for (let y = 0; y < ROWS; y++) take(COLS - 1, y, -1, 0);
  primed = true;

  // Each LED: a strip fading outward from the frame.
  rctx.clearRect(0, 0, raw.width, raw.height);
  const S = SPREAD;
  const strip = (j, x0, y0, x1, y1, w, h) => {
    const r = col[j] | 0, g = col[j + 1] | 0, b = col[j + 2] | 0;
    // A soft curve, not a straight fade: strong near the frame, a long gentle tail.
    const grad = rctx.createLinearGradient(x0, y0, x1, y1);
    grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
    grad.addColorStop(0.25, `rgba(${r},${g},${b},.62)`);
    grad.addColorStop(0.55, `rgba(${r},${g},${b},.26)`);
    grad.addColorStop(0.8, `rgba(${r},${g},${b},.08)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    rctx.fillStyle = grad;
    rctx.fillRect(Math.min(x0, x1) - (w > 1 ? 0 : 0), Math.min(y0, y1), w, h);
  };
  let j = 0;
  for (let x = 0; x < COLS; x++, j += 3) strip(j, S + x, S + 1, S + x, 0, 1, S + 1);                         // top
  for (let x = 0; x < COLS; x++, j += 3) strip(j, S + x, S + ROWS - 1, S + x, S * 2 + ROWS, 1, S + 1);       // bottom
  for (let y = 0; y < ROWS; y++, j += 3) strip(j, S + 1, S + y, 0, S + y, S + 1, 1);                         // left
  for (let y = 0; y < ROWS; y++, j += 3) strip(j, S + COLS - 1, S + y, S * 2 + COLS, S + y, S + 1, 1);       // right
  lctx.clearRect(0, 0, leds.width, leds.height);
  lctx.filter = "blur(3px)"; // at this tiny size; stretched, it reads as a wide, smooth glow
  lctx.drawImage(raw, 0, 0);
  lctx.filter = "none";
  cost = cost * 0.9 + (performance.now() - t0) * 0.1;
}

function frame(t) {
  drawStream(t);
  if (ledsOn && t - last > 80) { sampleEdges(); last = t; }
  if (!reduce) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (reduce) { drawStream(0); sampleEdges(); }
setInterval(() => { $("cost").textContent = ledsOn ? `ambilight ≈ ${cost.toFixed(2)} ms per update · 12 per second · no page-sized blur` : ""; }, 1000);
$("opt-leds").onchange = (e) => { ledsOn = e.target.checked; leds.classList.toggle("off", !ledsOn); };

renderTicker(false);
renderInfo();
renderPeople();
</script>
