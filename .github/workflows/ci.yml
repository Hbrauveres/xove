# Commit checks: stages 1–3 of the pipeline, on every commit.
#
#   1 · Build               api and web Docker images, saved as artifacts
#   2 · Validate build      start db + api + web from those images, wait until healthy
#   3 · Unit tests          api (JUnit + Testcontainers) and web (Vitest)
#   3 · Vulnerability scan  Trivy on both images and the web dependencies
#   3 · SAST                Semgrep on the source code
#
# Runs on every push to any branch except main, so a branch is checked commit by
# commit, before and after a pull request exists. A pull request's required checks
# are these same runs (GitHub matches checks by commit). The stage release
# (stage.yml) calls this workflow first on main.
# Full explanation: docs/pipeline.md

name: Commit checks

on:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}-${{ github.event_name }}
  # A new commit on a branch cancels the older run; runs for main always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE_PREFIX: ghcr.io/hbrauveres/xove
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  SEMGREP_IMAGE: semgrep/semgrep:1.177.0

jobs:
  # ---------------------------------------------------------------- stage 1
  build:
    name: 1 · Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Today's date (the web image rebuilds Caddy from source once a day)
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build the ${{ matrix.service }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.service }}
          pull: true
          build-args: REFRESH=${{ steps.date.outputs.day }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:ci
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.service }}.tar
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Keep the image for the next stages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}.tar
          retention-days: 3

  # ---------------------------------------------------------------- stage 2
  validate:
    name: 2 · Validate build
    needs: build
    runs-on: ubuntu-latest
    env:
      # Throwaway values: this stack lives for a minute inside the runner.
      APP_ENV: ci
      IMAGE_TAG: ci
      POSTGRES_DB: xove
      POSTGRES_USER: xove
      POSTGRES_PASSWORD: ci-only-password
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      ADMIN_EMAILS: ""
      LIVEKIT_URL: ""
      LIVEKIT_API_KEY: ""
      LIVEKIT_API_SECRET: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load the images
        run: for f in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$f"; done

      - name: Start db, api and web
        run: |
          docker network create web
          docker compose up -d --no-build db api web

      - name: Wait until healthy
        run: ops/healthcheck.sh 150

      - name: Check that the API refuses anonymous requests
        run: docker compose exec -T api sh -c 'wget -S -qO- http://localhost:8080/api/me 2>&1 | grep -q " 401"'

      - name: Show logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------- stage 3
  unit-tests-api:
    name: 3 · Unit tests (api)
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: JUnit + Testcontainers
        run: ./mvnw -B verify

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-test-reports
          path: api/target/surefire-reports
          retention-days: 7

  unit-tests-web:
    name: 3 · Unit tests (web)
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test

  vuln-scan:
    name: 3 · Vulnerability scan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Today's date (the vulnerability database is cached per day)
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-

      - name: Scan the images and the web dependencies
        # HIGH and CRITICAL only, and only when a fixed version exists: those are
        # the ones we can act on. Every target is scanned before the job fails.
        run: |
          trivy() {
            docker run --rm \
              -v "$RUNNER_TEMP/images:/images:ro" \
              -v "$GITHUB_WORKSPACE:/src:ro" \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              "$TRIVY_IMAGE" "$@" \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile /src/.trivyignore --no-progress
          }
          status=0
          for service in api web; do
            echo "::group::image $service"
            trivy image --input "/images/$service.tar" || status=1
            echo "::endgroup::"
          done
          echo "::group::web dependencies (package-lock.json)"
          trivy fs --scanners vuln /src/web || status=1
          echo "::endgroup::"
          exit "$status"

  sast:
    name: 3 · SAST
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --error \
            --config p/default --config p/java --config p/typescript \
            --config p/react --config p/secrets --config p/dockerfile
