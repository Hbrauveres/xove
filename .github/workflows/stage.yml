# Stage release: every push to main (a merged pull request).
#
#   Checks                  stages 1–3, the same workflow every commit runs (ci.yml)
#   4 · Publish images      push to GitHub Container Registry as sha-<commit>
#   5 · Deploy stage        the VPS pulls them; it rolls back by itself if unhealthy
#   6 · Remove failed images   only when publish worked but the deploy didn't
#   Notify Discord          posts every result (success, failure, cancelled) to a Discord channel
#
# Full explanation: docs/pipeline.md

name: Stage release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-release
  # Merges are released one at a time, in order; none is cancelled.
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/hbrauveres/xove

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------- stage 4
  publish:
    name: 4 · Publish images
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load the images
        run: for f in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$f"; done

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag with the commit and push
        id: push
        run: |
          tag="sha-${GITHUB_SHA::12}"
          for service in api web; do
            docker tag "$IMAGE_PREFIX-$service:ci" "$IMAGE_PREFIX-$service:$tag"
            docker push "$IMAGE_PREFIX-$service:$tag"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Published \`$tag\` for api and web." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- stage 5
  deploy-stage:
    name: 5 · Deploy stage
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - name: Set up the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy (the VPS rolls back by itself if the new version isn't healthy)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        # The key only runs ops/deploy.sh on the VPS; "deploy <sha>" is its argument.
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"

      - name: Check staging from the internet
        env:
          STAGE_COOKIE: ${{ secrets.STAGE_COOKIE }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            --cookie "xove_stage=$STAGE_COOKIE" \
            https://stage.xove.app/api/health

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark these images as the ones on stage
        run: |
          for service in api web; do
            docker buildx imagetools create -t "$IMAGE_PREFIX-$service:stage" "$IMAGE_PREFIX-$service:$TAG"
          done
          echo "Staging now runs \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- stage 6
  cleanup:
    name: 6 · Remove failed images
    needs: [publish, deploy-stage]
    if: failure() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      TAG: ${{ needs.publish.outputs.tag }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete this commit's images from the registry
        # Staging already rolled back to the previous version (ops/deploy.sh);
        # this removes the images that failed, so nobody deploys them by mistake.
        run: |
          for service in api web; do
            ids=$(gh api --paginate "/users/$OWNER/packages/container/xove-$service/versions" \
              --jq ".[] | select(.metadata.container.tags | index(\"$TAG\")) | .id")
            for id in $ids; do
              gh api -X DELETE "/users/$OWNER/packages/container/xove-$service/versions/$id"
              echo "deleted xove-$service:$TAG (version $id)"
            done
          done
          echo "Deploy of \`$TAG\` failed: staging was rolled back and the images were removed." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- notify
  notify:
    name: Notify Discord
    needs: [checks, publish, deploy-stage, cleanup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post the result to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHECKS: ${{ needs.checks.result }}
          PUBLISH: ${{ needs.publish.result }}
          DEPLOY: ${{ needs.deploy-stage.result }}
          CLEANUP: ${{ needs.cleanup.result }}
          TAG: ${{ needs.publish.outputs.tag }}
          # Commit text goes through env and jq, never into the script itself.
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          if [[ -z "$WEBHOOK" ]]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not set; no notification sent."
            exit 0
          fi

          icon() {
            case "$1" in
              success) echo "✅" ;; failure) echo "❌" ;; cancelled) echo "⚪" ;; *) echo "➖" ;;
            esac
          }

          if [[ "$DEPLOY" == "success" ]]; then
            title="✅ Stage release: $TAG is live"; color=3066993
          elif [[ "$CHECKS" == "cancelled" || "$PUBLISH" == "cancelled" || "$DEPLOY" == "cancelled" ]]; then
            title="⚪ Stage release cancelled at ${GITHUB_SHA::12}"; color=9807270
          else
            title="❌ Stage release failed at ${GITHUB_SHA::12}"; color=15158332
          fi

          notes=""
          if [[ "$DEPLOY" == "failure" ]]; then
            notes="Staging rolled back to the previous version (or needs a fix forward if there was none)."
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"

          jq -n \
            --arg title "$title" --argjson color "$color" \
            --arg subject "${MESSAGE%%$'\n'*}" --arg author "$AUTHOR" \
            --arg commit "${GITHUB_SHA::12}" --arg commit_url "$commit_url" \
            --arg run_url "$run_url" --arg notes "$notes" \
            --arg stages "$(icon "$CHECKS") Checks  $(icon "$PUBLISH") Publish  $(icon "$DEPLOY") Deploy  $(icon "$CLEANUP") Cleanup" \
            '{
              username: "Xovê pipeline",
              allowed_mentions: { parse: [] },
              embeds: [{
                title: $title,
                url: $run_url,
                color: $color,
                description: ("[`" + $commit + "`](" + $commit_url + ") " + $subject + " — " + $author
                              + (if $notes == "" then "" else "\n\n" + $notes end)),
                fields: [
                  { name: "Stages", value: $stages },
                  { name: "Links", value: ("[Run](" + $run_url + ") · [Staging](https://stage.xove.app)") }
                ]
              }]
            }' > payload.json

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data @payload.json "$WEBHOOK"
