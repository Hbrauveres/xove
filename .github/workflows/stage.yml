# Stage release: every push to main (a merged pull request).
#
#   Checks                  stages 1–3, the same workflow every commit runs (ci.yml)
#   4 · Publish images      push to GitHub Container Registry as sha-<commit>
#   5 · Deploy stage        the API, then the web app, each through its own key (spec 0063);
#                           the VPS pulls the app's image and rolls it back by itself if unhealthy
#   6 · Remove failed images   only the app whose new version ran on the VPS and wasn't healthy
#   Notify Discord          posts every result (success, failure, cancelled) to a Discord channel
#
# Full explanation: docs/pipeline.md in the xove-workspace repo

name: Stage release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-release
  # Merges are released one at a time, in order; none is cancelled.
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/hbrauveres/xove

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    # Only the Docker Hub login, never the 1Password token.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # ---------------------------------------------------------------- stage 4
  publish:
    name: 4 · Publish images
    needs: checks
    # Only main is released: the server refuses commits that aren't on main
    # (shared-infra's ops/deploy.sh), so a manual run from a branch stops after the checks.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load the images
        run: for f in "$RUNNER_TEMP"/images/*.tar; do docker load -i "$f"; done

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag with the commit and push
        id: push
        run: |
          tag="sha-${GITHUB_SHA::12}"
          for service in api web; do
            docker tag "$IMAGE_PREFIX-$service:ci" "$IMAGE_PREFIX-$service:$tag"
            docker push "$IMAGE_PREFIX-$service:$tag"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Published \`$tag\` for api and web." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- stage 5
  # Two apps, each through its own key (spec 0063): the API first, so a web app
  # that needs a new API never runs before it; the web app only after the API is healthy.
  deploy-api:
    name: 5 · Deploy stage (API)
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      app: xove-api
      key: deploy-ssh-api
      command: deploy ${{ github.sha }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  deploy-web:
    name: 5 · Deploy stage (web)
    needs: [publish, deploy-api]
    uses: ./.github/workflows/deploy.yml
    with:
      app: xove-web
      key: deploy-ssh-web
      command: deploy ${{ github.sha }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  mark-stage:
    name: 5 · Mark the images on stage
    needs: [publish, deploy-api, deploy-web]
    # Each app that deployed, even when the other didn't.
    if: always() && needs.publish.result == 'success' && (needs.deploy-api.result == 'success' || needs.deploy-web.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      TAG: ${{ needs.publish.outputs.tag }}
      API: ${{ needs.deploy-api.result }}
      WEB: ${{ needs.deploy-web.result }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark these images as the ones on stage
        run: |
          for service in api web; do
            result=API; [[ $service == web ]] && result=WEB
            [[ "${!result}" == success ]] || continue
            docker buildx imagetools create --prefer-index=false -t "$IMAGE_PREFIX-$service:stage" "$IMAGE_PREFIX-$service:$TAG"
            echo "Staging's xove-$service now runs \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------- stage 6
  cleanup:
    name: 6 · Remove failed images
    needs: [publish, deploy-api, deploy-web]
    # Only the images of the app that ran and wasn't healthy: a deploy refused before anything
    # changed (GitHub, the registry or 1Password unreachable, another deploy running) keeps them
    # for a re-run, and the other app's image stays (it may be running).
    if: >-
      failure() && needs.publish.result == 'success' &&
      (needs.deploy-api.outputs.unhealthy == 'true' || needs.deploy-web.outputs.unhealthy == 'true')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      TAG: ${{ needs.publish.outputs.tag }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      API_UNHEALTHY: ${{ needs.deploy-api.outputs.unhealthy }}
      WEB_UNHEALTHY: ${{ needs.deploy-web.outputs.unhealthy }}
    steps:
      - name: Delete the failed app's images from the registry
        # Staging already rolled back that app to its previous version (shared-infra's ops/deploy.sh);
        # this removes the images that failed, so nobody deploys them by mistake.
        # GHCR deletes whole versions, not single tags. A commit that didn't change
        # an image (docs only) shares its version with earlier tags, so a version
        # is only deleted when this commit's tag is its only tag.
        run: |
          for service in api web; do
            unhealthy=API_UNHEALTHY; [[ $service == web ]] && unhealthy=WEB_UNHEALTHY
            [[ "${!unhealthy}" == true ]] || continue
            versions=$(gh api --paginate "/users/$OWNER/packages/container/xove-$service/versions" \
              --jq ".[] | select(.metadata.container.tags | index(\"$TAG\")) | \"\(.id) \(.metadata.container.tags | length)\"")
            while read -r id tags; do
              [[ -z "$id" ]] && continue
              if [[ "$tags" == 1 ]]; then
                gh api -X DELETE "/users/$OWNER/packages/container/xove-$service/versions/$id"
                echo "deleted xove-$service:$TAG (version $id)"
              else
                echo "kept xove-$service version $id: it also carries $((tags - 1)) other tag(s)"
              fi
            done <<< "$versions"
            echo "Deploy of xove-$service \`$TAG\` failed: it was rolled back; images only this commit used were removed." >> "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------- notify
  notify:
    name: Notify Discord
    needs: [checks, publish, deploy-api, deploy-web, cleanup]
    # Every release of main, whatever happened; a manual run from a branch isn't a release.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Load the Discord webhook from 1Password
        id: vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.39.0
          # Values only as this step's (masked) outputs, never in the job's environment.
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DISCORD_WEBHOOK_URL: op://Xove CI/discord-webhook/password

      - name: Post the result to Discord
        env:
          WEBHOOK: ${{ steps.vault.outputs.DISCORD_WEBHOOK_URL }}
          CHECKS: ${{ needs.checks.result }}
          PUBLISH: ${{ needs.publish.result }}
          API: ${{ needs.deploy-api.result }}
          WEB: ${{ needs.deploy-web.result }}
          CLEANUP: ${{ needs.cleanup.result }}
          TAG: ${{ needs.publish.outputs.tag }}
          # Commit text goes through env and jq, never into the script itself.
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          if [[ -z "$WEBHOOK" ]]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not set; no notification sent."
            exit 0
          fi

          icon() {
            case "$1" in
              success) echo "✅" ;; failure) echo "❌" ;; cancelled) echo "⚪" ;; *) echo "⏭️" ;;
            esac
          }

          if [[ "$API" == "success" && "$WEB" == "success" ]]; then
            title="✅ Stage release: $TAG is live"; color=3066993
          elif [[ "$CHECKS" == "cancelled" || "$PUBLISH" == "cancelled" || "$API" == "cancelled" || "$WEB" == "cancelled" ]]; then
            title="⚪ Stage release cancelled at ${GITHUB_SHA::12}"; color=9807270
          else
            title="❌ Stage release failed at ${GITHUB_SHA::12}"; color=15158332
          fi

          notes=""
          if [[ "$API" == "failure" ]]; then
            notes="The API's deploy failed: it was rolled back, or needs a fix forward (the deploy log says which). The web app wasn't deployed."
          elif [[ "$WEB" == "failure" ]]; then
            notes="The web app's deploy failed: it was rolled back, or needs a fix forward (the deploy log says which). The API runs the new version."
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"

          jq -n \
            --arg title "$title" --argjson color "$color" \
            --arg subject "${MESSAGE%%$'\n'*}" --arg author "$AUTHOR" \
            --arg commit "${GITHUB_SHA::12}" --arg commit_url "$commit_url" \
            --arg run_url "$run_url" --arg notes "$notes" \
            --arg stages "$(icon "$CHECKS") Checks  $(icon "$PUBLISH") Publish  $(icon "$API") Deploy API  $(icon "$WEB") Deploy web  $(icon "$CLEANUP") Cleanup" \
            '{
              username: "Xovê pipeline",
              allowed_mentions: { parse: [] },
              embeds: [{
                title: $title,
                url: $run_url,
                color: $color,
                description: ("[`" + $commit + "`](" + $commit_url + ") " + $subject + " — " + $author
                              + (if $notes == "" then "" else "\n\n" + $notes end)),
                fields: [
                  { name: "Stages", value: $stages },
                  { name: "Links", value: ("[Run](" + $run_url + ") · [Staging](https://stage.xove.app)") }
                ]
              }]
            }' > payload.json

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data @payload.json "$WEBHOOK"
