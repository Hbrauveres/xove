# Production release: a version tag (vX.Y.Z) on a commit of main releases that
# commit to https://xove.app. Nobody deploys production by hand (spec 0046).
#
#   1 · Check the release        the tag is vX.Y.Z on main; the commit's stage release was green; its images exist
#   2 · Tag the images           the commit's sha-<12> images also get vX.Y.Z (the same images, no rebuild)
#   3 · Deploy production        the VPS runs them (infra's ops/deploy.sh xove prod) and rolls back by itself if unhealthy
#   4 · Check production         https://xove.app and its API answer from the internet
#   5 · Roll back production     only when the check fails; the "Run workflow" button runs this stage alone
#   6 · GitHub Release           notes of what changed (a pre-release for v0.0.x)
#   Notify Discord               every result
#
# Full explanation: docs/pipeline.md in the xove-workspace repo

name: Production release

on:
  push:
    tags: ["v*"]
  # The "Run workflow" button: rolls production back to the version that ran before.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  # Releases and rollbacks run one at a time; a running one is never cancelled.
  # GitHub keeps only one run waiting: a newer one replaces it (and that one posts nothing).
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/hbrauveres/xove
  SITE: https://xove.app

jobs:
  # ---------------------------------------------------------------- stage 1
  verify:
    name: 1 · Check the release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # to read the commit's stage release
    outputs:
      tag: ${{ steps.images.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # to see whether the tagged commit is on main

      - name: The tag is a version (vX.Y.Z) on a commit of main
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME isn't a version tag like v1.2.3"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA::12} isn't on main; only merged commits are released"; exit 1
          fi

      - name: The commit's stage release was green
        # Its images were built, tested, scanned and ran healthy on staging.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/stage.yml/runs?head_sha=$GITHUB_SHA&status=success&event=push&branch=main" --jq .total_count)
          if [[ "$green" == 0 ]]; then
            echo "::error::${GITHUB_SHA::12} never passed a stage release; release a commit that runs on staging"; exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Its images are in the registry
        id: images
        run: |
          tag="sha-${GITHUB_SHA::12}"
          for service in api web; do
            docker buildx imagetools inspect "$IMAGE_PREFIX-$service:$tag" >/dev/null \
              || { echo "::error::$IMAGE_PREFIX-$service:$tag is missing"; exit 1; }
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- stage 2
  promote:
    name: 2 · Tag the images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the images with the version
        # The same images (same digests) under a second name; nothing is rebuilt.
        run: |
          for service in api web; do
            docker buildx imagetools create --prefer-index=false -t "$IMAGE_PREFIX-$service:$GITHUB_REF_NAME" "$IMAGE_PREFIX-$service:$TAG"
          done
          echo "\`$TAG\` is also \`$GITHUB_REF_NAME\`." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- stage 3
  deploy-production:
    name: 3 · Deploy production
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Production's own key (spec 0046), from the 1Password vault "Xove CI". On the VPS it
      # can only run infra's ops/deploy.sh for xove on production (a forced command).
      - name: Load production's deploy key from 1Password
        id: vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.39.0
          # Values only as this step's (masked) outputs, never in the job's environment.
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DEPLOY_SSH_KEY: op://Xove CI/deploy-ssh-prod/private_key?ssh-format=openssh
          DEPLOY_KNOWN_HOSTS: op://Xove CI/deploy-ssh-prod/known-hosts
          DEPLOY_HOST: op://Xove CI/deploy-ssh-prod/host
          DEPLOY_PORT: op://Xove CI/deploy-ssh-prod/port
          DEPLOY_USER: op://Xove CI/deploy-ssh-prod/user

      - name: Set up the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ steps.vault.outputs.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ steps.vault.outputs.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Keys saved in the Windows 1Password app come with \r\n line endings, which ssh can't read.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      - name: Deploy (the VPS rolls back by itself if the new version isn't healthy)
        env:
          DEPLOY_HOST: ${{ steps.vault.outputs.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ steps.vault.outputs.DEPLOY_PORT }}
          DEPLOY_USER: ${{ steps.vault.outputs.DEPLOY_USER }}
        # Only connecting is retried (5 attempts, 20 s each); the command is sent once.
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            -o ConnectTimeout=20 -o ConnectionAttempts=5 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"

  # ---------------------------------------------------------------- stage 4
  check-production:
    name: 4 · Check production
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: xove.app and its API answer from the internet
        # Up to 2 minutes: the page loads and the API says it's up.
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 10 "$SITE/" | grep -q '<div id="root">' \
              && curl -fsS --max-time 10 "$SITE/api/health" | grep -q '"status":"UP"'; then
              echo "$SITE answers (attempt $attempt)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$SITE didn't answer as expected for 2 minutes"
          exit 1

  # ---------------------------------------------------------------- stage 5
  rollback-production:
    name: 5 · Roll back production
    needs: check-production
    # When the check fails after a release, or alone from the "Run workflow" button (on main).
    # A failed deploy isn't rolled back here: the VPS already did it.
    if: >-
      always() && (
        (github.event_name == 'push' && needs.check-production.result == 'failure') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Load production's deploy key from 1Password
        id: vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.39.0
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DEPLOY_SSH_KEY: op://Xove CI/deploy-ssh-prod/private_key?ssh-format=openssh
          DEPLOY_KNOWN_HOSTS: op://Xove CI/deploy-ssh-prod/known-hosts
          DEPLOY_HOST: op://Xove CI/deploy-ssh-prod/host
          DEPLOY_PORT: op://Xove CI/deploy-ssh-prod/port
          DEPLOY_USER: op://Xove CI/deploy-ssh-prod/user

      - name: Set up the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ steps.vault.outputs.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ steps.vault.outputs.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Keys saved in the Windows 1Password app come with \r\n line endings, which ssh can't read.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      - name: Roll back (the version that ran before the current one)
        env:
          DEPLOY_HOST: ${{ steps.vault.outputs.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ steps.vault.outputs.DEPLOY_PORT }}
          DEPLOY_USER: ${{ steps.vault.outputs.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            -o ConnectTimeout=20 -o ConnectionAttempts=5 \
            "$DEPLOY_USER@$DEPLOY_HOST" "rollback"

      - name: xove.app answers again
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 10 "$SITE/api/health" | grep -q '"status":"UP"'; then
              echo "$SITE answers (attempt $attempt)"; exit 0
            fi
            sleep 5
          done
          echo "::error::$SITE didn't answer after the rollback"; exit 1

  # ---------------------------------------------------------------- stage 6
  github-release:
    name: 6 · GitHub Release
    needs: check-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # v0.0.x versions are test releases (no backups yet): marked as pre-releases.
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == v0.0.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"

  # ---------------------------------------------------------------- notify
  notify:
    name: Notify Discord
    needs: [verify, promote, deploy-production, check-production, rollback-production, github-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load the Discord webhook from 1Password
        id: vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.39.0
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DISCORD_WEBHOOK_URL: op://Xove CI/discord-webhook/password

      - name: Post the result to Discord
        env:
          WEBHOOK: ${{ steps.vault.outputs.DISCORD_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          VERIFY: ${{ needs.verify.result }}
          PROMOTE: ${{ needs.promote.result }}
          DEPLOY: ${{ needs.deploy-production.result }}
          CHECK: ${{ needs.check-production.result }}
          ROLLBACK: ${{ needs.rollback-production.result }}
          RELEASE: ${{ needs.github-release.result }}
        run: |
          if [[ -z "$WEBHOOK" ]]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not set; no notification sent."
            exit 0
          fi

          icon() {
            case "$1" in
              success) echo "✅" ;; failure) echo "❌" ;; cancelled) echo "⚪" ;; *) echo "⏭️" ;;
            esac
          }

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$ROLLBACK" == "success" ]]; then
              title="↩️ Production rolled back"; color=15105570
            elif [[ "$ROLLBACK" == "skipped" ]]; then
              title="⏭️ Rollback skipped: run it from main"; color=9807270
            else
              title="❌ Production rollback failed: check the server"; color=15158332
            fi
            stages="$(icon "$ROLLBACK") Roll back"
          else
            if [[ "$CHECK" == "success" ]]; then
              title="✅ Production release: $GITHUB_REF_NAME is live"; color=3066993
            elif [[ "$ROLLBACK" == "success" ]]; then
              title="❌ Production release $GITHUB_REF_NAME failed its check; rolled back"; color=15158332
            elif [[ "$CHECK" == "failure" || "$CHECK" == "cancelled" ]]; then
              title="❌ Production release $GITHUB_REF_NAME failed its check and wasn't rolled back: production may be broken, check the server"; color=15158332
            elif [[ "$DEPLOY" == "failure" || "$DEPLOY" == "cancelled" ]]; then
              title="❌ Production release $GITHUB_REF_NAME failed to deploy: see the run log (the VPS rolls back by itself when it can)"; color=15158332
            elif [[ "$VERIFY" == "cancelled" || "$PROMOTE" == "cancelled" ]]; then
              title="⚪ Production release $GITHUB_REF_NAME cancelled"; color=9807270
            else
              title="❌ Production release $GITHUB_REF_NAME failed; production didn't change"; color=15158332
            fi
            stages="$(icon "$VERIFY") Check release  $(icon "$PROMOTE") Tag images  $(icon "$DEPLOY") Deploy  $(icon "$CHECK") Check production  $(icon "$ROLLBACK") Roll back  $(icon "$RELEASE") GitHub Release"
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"

          jq -n \
            --arg title "$title" --argjson color "$color" \
            --arg commit "${GITHUB_SHA::12}" --arg commit_url "$commit_url" \
            --arg run_url "$run_url" --arg stages "$stages" --arg actor "$GITHUB_ACTOR" \
            '{
              username: "Xovê pipeline",
              allowed_mentions: { parse: [] },
              embeds: [{
                title: $title,
                url: $run_url,
                color: $color,
                description: ("[`" + $commit + "`](" + $commit_url + ") — " + $actor),
                fields: [
                  { name: "Stages", value: $stages },
                  { name: "Links", value: ("[Run](" + $run_url + ") · [Production](https://xove.app)") }
                ]
              }]
            }' > payload.json

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data @payload.json "$WEBHOOK"
