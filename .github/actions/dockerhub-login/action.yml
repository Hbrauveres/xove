# Logs the job in to Docker Hub, so its pulls count against our account's limit
# instead of the anonymous limit that GitHub's shared runners keep running out of
# (429 Too Many Requests). The credentials come from the 1Password vault "Xove CI".
# Without the service account's token (Dependabot's runs), it does nothing and the
# pulls stay anonymous.
name: Log in to Docker Hub
description: Docker Hub login from the Xove CI vault, skipped without the 1Password token
inputs:
  op-token:
    description: The xove-ci service account's token (secrets.OP_SERVICE_ACCOUNT_TOKEN)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Load the Docker Hub login from 1Password
      id: vault
      if: inputs.op-token != ''
      uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
      with:
        version: 2.39.0
        export-env: false
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-token }}
        DOCKERHUB_USERNAME: op://Xove CI/dockerhub/username
        DOCKERHUB_TOKEN: op://Xove CI/dockerhub/password

    - name: Log in to Docker Hub
      if: inputs.op-token != ''
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ steps.vault.outputs.DOCKERHUB_USERNAME }}
        password: ${{ steps.vault.outputs.DOCKERHUB_TOKEN }}
