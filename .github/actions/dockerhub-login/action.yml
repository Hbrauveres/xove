# Logs the job in to Docker Hub, so its pulls count against our account's limit
# instead of the anonymous limit that GitHub's shared runners keep running out of
# (429 Too Many Requests). The username and a read-only token are GitHub secrets,
# copied from the 1Password item "dockerhub" (decision 45): the checks run on every
# branch, so they never get the 1Password token. Without them (Dependabot's runs),
# or when the login keeps failing, the pulls stay anonymous.
name: Log in to Docker Hub
description: Docker Hub login from the DOCKERHUB_* secrets, skipped without them
inputs:
  username:
    description: secrets.DOCKERHUB_USERNAME
    required: false
    default: ""
  token:
    description: secrets.DOCKERHUB_TOKEN (public repos, read-only)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Log in to Docker Hub
      if: inputs.username != '' && inputs.token != ''
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.username }}
        DOCKERHUB_TOKEN: ${{ inputs.token }}
      # Docker Hub's sign-in sometimes times out when several jobs start at once.
      # Three tries, waiting 5 s then 15 s plus a random 0-5 s so parallel jobs
      # don't retry together. The login only lifts the pull limit, so if every try
      # fails the job goes on and pulls anonymously.
      run: |
        for wait in 5 15 0; do
          if printf %s "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin; then
            exit 0
          fi
          [ "$wait" -gt 0 ] || break
          sleep $((wait + RANDOM % 6))
        done
        echo "::warning::Docker Hub login failed 3 times; pulling anonymously"
