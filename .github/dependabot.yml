# Weekly pull requests that bump outdated dependencies. The pipeline tests each one,
# so a green PR is safe to merge. Grouped per ecosystem to keep the noise down.
# A new version waits 7 days before it's proposed, so a compromised release has
# time to be caught and pulled (security updates don't wait).
version: 2
updates:
  - package-ecosystem: maven
    directory: /api
    schedule: { interval: weekly }
    # Paused while the API is frozen: it now lives in xove-api, and this copy
    # goes with xove-workspace#82.
    open-pull-requests-limit: 0
    cooldown: { default-days: 7 }
    groups: { maven: { patterns: ["*"] } }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { npm: { patterns: ["*"] } }

  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    # Node stays on its LTS line; moving to the next LTS is a deliberate change,
    # not a Dependabot bump.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    # Paused while the API is frozen (see maven above).
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups: { github-actions: { patterns: ["*"] } }
