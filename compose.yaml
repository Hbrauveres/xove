services:
  web:
    image: ghcr.io/hbrauveres/xove-web:${IMAGE_TAG:-local}
    build: ./web
    container_name: xove-${APP_ENV:-prod}-web
    restart: unless-stopped
    networks:
      - web

  api:
    image: ghcr.io/hbrauveres/xove-api:${IMAGE_TAG:-local}
    build: ./api
    container_name: xove-${APP_ENV:-prod}-api
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - internal

  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: xove-${APP_ENV:-prod}-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # The whole LiveKit config. It's here instead of a file because the webhook
      # needs the API key, and LiveKit's YAML can't read environment variables
      # (a config file is ignored when LIVEKIT_CONFIG is set). No secrets in it.
      LIVEKIT_CONFIG: |
        # Signaling (WebSocket). Only Caddy talks to this port, over the Docker network.
        port: 7880
        rtc:
          # Fallback for networks that block UDP: WebRTC over TCP.
          tcp_port: 7881
          # All UDP media on one port (UDP mux) instead of a 50000-60000 range.
          udp_port: 7882
          # Ask a STUN server for the VPS's public IP, so browsers get an address they can reach.
          use_external_ip: true
        room:
          # Close a room 5 minutes after the last person leaves.
          empty_timeout: 300
        # Room events go to this environment's API, signed with this key's secret,
        # so it can free the screen when the sharer leaves (specs/0038-stale-slot).
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://api:8080/api/livekit/webhook
        logging:
          level: info
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    mem_limit: 512m
    networks:
      - web
      # "api" only resolves to this environment's API on this network.
      - internal

  db:
    image: postgres:17-alpine
    container_name: xove-${APP_ENV:-prod}-db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

networks:
  web:
    external: true
  internal: {}

volumes:
  db_data:
