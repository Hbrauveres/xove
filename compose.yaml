services:
  web:
    image: ghcr.io/hbrauveres/xove-web:${IMAGE_TAG:-local}
    build: ./web
    container_name: xove-${APP_ENV:-prod}-web
    restart: unless-stopped
    # "Healthy" is defined here, with the app: the server's deploy and CI both wait for it.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ | grep -q '<div id=\"root\">'"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - web

  api:
    image: ghcr.io/hbrauveres/xove-api:${IMAGE_TAG:-local}
    build: ./api
    container_name: xove-${APP_ENV:-prod}-api
    restart: unless-stopped
    mem_limit: 512m
    # ${VAR:?…} marks a setting the app can't run without: Compose stops with an
    # error instead of starting it empty. LiveKit and ADMIN_EMAILS are optional.
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?is required (built by infra/ops/build-env)}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?is required (built by infra/ops/build-env)}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?is required (built by infra/ops/build-env)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?is required (built by infra/ops/build-env)}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?is required (built by infra/ops/build-env)}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # This environment's room (staging xove-stage, production xove). LiveKit itself
      # runs from the infra repo, one server per environment (spec 0044).
      LIVEKIT_ROOM: ${LIVEKIT_ROOM:-xove}
      # People in the room at once, 1 to 20 (spec 0060); staging uses fewer to try the queue.
      XOVE_ROOM_SEATS: ${XOVE_ROOM_SEATS:-20}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - internal

  db:
    image: postgres:17-alpine
    container_name: xove-${APP_ENV:-prod}-db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?is required (built by infra/ops/build-env)}
      POSTGRES_USER: ${POSTGRES_USER:?is required (built by infra/ops/build-env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?is required (built by infra/ops/build-env)}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

networks:
  web:
    external: true
  internal: {}

volumes:
  db_data:
