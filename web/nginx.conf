# Serves the built React app. Caddy (the shared proxy) does TLS in front of it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite puts a content hash in every file name under /assets: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a React Router route: serve index.html, never cache it.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
